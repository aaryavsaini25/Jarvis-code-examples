<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Apex Racer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* Modern UI Overlay */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            display: flex;
            gap: 20px;
            pointer-events: none;
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .hud-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
        }

        .hud-value {
            font-size: 32px;
            font-weight: 800;
            font-style: italic;
            background: linear-gradient(45deg, #ff0055, #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Game Over Screen */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #game-over.active {
            opacity: 1;
            pointer-events: auto;
        }

        #game-over h1 {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 10px;
            color: #ff0055;
            text-shadow: 0 0 20px rgba(255,0,85,0.5);
        }

        #game-over p {
            font-size: 20px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(45deg, #ff0055, #ff5500);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,0,85,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255,0,85,0.8);
        }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-card">
            <div class="hud-label">Speed</div>
            <div class="hud-value"><span id="speed-val">0</span> <small style="font-size: 14px">KM/H</small></div>
        </div>
        <div class="hud-card">
            <div class="hud-label">Score</div>
            <div class="hud-value" id="score-val">0</div>
        </div>
    </div>

    <div id="controls-hint">Use [A]/[D] or [←]/[→] to Steer | [W]/[↑] Accelerate | [S]/[↓] Brake</div>

    <div id="game-over">
        <h1>CRASHED</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button class="btn" onclick="resetGame()">RACE AGAIN</button>
    </div>

    <script>
        // --- GAME CONFIGURATION & STATE ---
        const CONFIG = {
            roadWidth: 14,
            lanes: 3,
            maxSpeed: 180,
            acceleration: 0.8,
            deceleration: 0.4,
            brake: 1.2,
            handling: 0.12,
            cameraFovBase: 60
        };

        let state = {
            speed: 0,
            distance: 0,
            playerX: 0,
            targetPlayerX: 0,
            score: 0,
            isGameOver: false,
            keys: { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, a: false, d: false, w: false, s: false }
        };

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a10);
        scene.fog = new THREE.FogExp2(0x0a0a10, 0.015);

        const camera = new THREE.PerspectiveCamera(CONFIG.cameraFovBase, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, -6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, -20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Subtle dynamic point lights for modern aesthetic
        const lightBlue = new THREE.PointLight(0x00d2ff, 1, 50);
        lightBlue.position.set(-10, 5, 20);
        scene.add(lightBlue);

        // --- PROCEDURAL TEXTURES ---
        function createRoadTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, 512, 512);

            // Dash lines
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 512; i += 64) {
                ctx.fillRect(168, i + 16, 8, 32);
                ctx.fillRect(336, i + 16, 8, 32);
            }

            // Side lines
            ctx.fillRect(10, 0, 12, 512);
            ctx.fillRect(490, 0, 12, 512);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 20);
            return texture;
        }

        // --- ENVIRONMENT & ROAD ---
        const roadTexture = createRoadTexture();
        const roadGeo = new THREE.PlaneGeometry(CONFIG.roadWidth, 400);
        const roadMat = new THREE.MeshStandardMaterial({ map: roadTexture, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = 180;
        road.receiveShadow = true;
        scene.add(road);

        // Grass/Terrain Side Planes
        const terrainGeo = new THREE.PlaneGeometry(200, 400);
        const terrainMat = new THREE.MeshStandardMaterial({ color: 0x051105, roughness: 1 });
        
        const leftTerrain = new THREE.Mesh(terrainGeo, terrainMat);
        leftTerrain.rotation.x = -Math.PI / 2;
        leftTerrain.position.set(-107, -0.01, 180);
        scene.add(leftTerrain);

        const rightTerrain = new THREE.Mesh(terrainGeo, terrainMat);
        rightTerrain.rotation.x = -Math.PI / 2;
        rightTerrain.position.set(107, -0.01, 180);
        scene.add(rightTerrain);

        // --- CAR CREATOR (PROCEDURAL MESHES) ---
        function createCarMesh(color = 0xff0055) {
            const carGroup = new THREE.Group();

            // Main Body
            const bodyGeo = new THREE.BoxGeometry(1.6, 0.6, 3.6);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            body.castShadow = true;
            carGroup.add(body);

            // Cabin / Windows
            const cabinGeo = new THREE.BoxGeometry(1.3, 0.45, 1.8);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.9, -0.2);
            cabin.castShadow = true;
            carGroup.add(cabin);

            // Headlights
            const lightGeo = new THREE.BoxGeometry(0.3, 0.1, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const leftLight = new THREE.Mesh(lightGeo, lightMat);
            leftLight.position.set(-0.6, 0.5, 1.8);
            const rightLight = leftLight.clone();
            rightLight.position.x = 0.6;
            carGroup.add(leftLight, rightLight);

            // Taillights
            const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const leftTail = new THREE.Mesh(lightGeo, tailMat);
            leftTail.position.set(-0.6, 0.5, -1.8);
            const rightTail = leftTail.clone();
            rightTail.position.x = 0.6;
            carGroup.add(leftTail, rightTail);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
            wheelGeo.rotateZ(Math.PI / 2);

            const wheelPositions = [
                [-0.85, 0.3, 1.1], [0.85, 0.3, 1.1],
                [-0.85, 0.3, -1.1], [0.85, 0.3, -1.1]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...pos);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            return carGroup;
        }

        // Initialize Player Car
        const playerCar = createCarMesh(0x0066ff);
        scene.add(playerCar);

        // --- TRAFFIC SYSTEM ---
        const trafficCars = [];
        const carColors = [0xff0055, 0xffaa00, 0x00ff66, 0x9900ff, 0xffffff];
        const laneXPositions = [-4.5, 0, 4.5];

        function spawnTraffic() {
            for (let i = 0; i < 5; i++) {
                const color = carColors[Math.floor(Math.random() * carColors.length)];
                const trafficMesh = createCarMesh(color);
                
                // Random position ahead
                const lane = laneXPositions[Math.floor(Math.random() * laneXPositions.length)];
                const zPos = 50 + i * 40 + Math.random() * 20;
                
                trafficMesh.position.set(lane, 0, zPos);
                scene.add(trafficMesh);
                trafficCars.push(trafficMesh);
            }
        }
        spawnTraffic();

        // --- CONTROLS ---
        window.addEventListener('keydown', (e) => { if (e.key in state.keys) state.keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (e.key in state.keys) state.keys[e.key] = false; });

        // --- COLLISION DETECTION ---
        const playerBox = new THREE.Box3();
        const trafficBox = new THREE.Box3();

        function checkCollisions() {
            // Shrink bounding box slightly for forgiving gameplay feel
            playerBox.setFromObject(playerCar);
            playerBox.expandByScalar(-0.2); 

            for (let car of trafficCars) {
                trafficBox.setFromObject(car);
                trafficBox.expandByScalar(-0.2);

                if (playerBox.intersectsBox(trafficBox)) {
                    gameOver();
                    break;
                }
            }
        }

        function gameOver() {
            state.isGameOver = true;
            document.getElementById('final-score').innerText = Math.floor(state.score);
            document.getElementById('game-over').classList.add('active');
        }

        function resetGame() {
            state.isGameOver = false;
            state.speed = 0;
            state.distance = 0;
            state.score = 0;
            state.playerX = 0;
            playerCar.position.set(0, 0, 0);
            playerCar.rotation.set(0,0,0);

            // Reposition Traffic
            trafficCars.forEach((car, index) => {
                const lane = laneXPositions[Math.floor(Math.random() * laneXPositions.length)];
                car.position.set(lane, 0, 50 + index * 40);
            });

            document.getElementById('game-over').classList.remove('active');
        }

        // --- MAIN GAME LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (!state.isGameOver) {
                // 1. Handle Acceleration / Braking
                if (state.keys.ArrowUp || state.keys.w) {
                    state.speed = Math.min(CONFIG.maxSpeed, state.speed + CONFIG.acceleration);
                } else if (state.keys.ArrowDown || state.keys.s) {
                    state.speed = Math.max(0, state.speed - CONFIG.brake);
                } else {
                    state.speed = Math.max(0, state.speed - CONFIG.deceleration);
                }

                // Auto forward crawl so the player doesn't complete standstill easily
                if (state.speed < 10) state.speed += 0.1;

                // 2. Handle Steering
                if (state.keys.ArrowLeft || state.keys.a) {
                    state.targetPlayerX -= CONFIG.handling;
                }
                if (state.keys.ArrowRight || state.keys.d) {
                    state.targetPlayerX += CONFIG.handling;
                }

                // Clamp steering to road edges
                state.targetPlayerX = Math.max(-5.8, Math.min(5.8, state.targetPlayerX));
                
                // Smooth movement & Car Roll Dynamic
                state.playerX += (state.targetPlayerX - state.playerX) * 0.1;
                playerCar.position.x = state.playerX;
                playerCar.rotation.z = -(state.targetPlayerX - state.playerX) * 0.3; // Lean into turns
                playerCar.rotation.y = -(state.targetPlayerX - state.playerX) * 0.1;

                // 3. Environment Movement (Simulating Forward Motion)
                const speedFactor = (state.speed / 3.6) * delta; // Speed in m/s
                roadTexture.offset.y -= speedFactor * 0.05;

                // Move Traffic Cars towards player
                trafficCars.forEach(car => {
                    car.position.z -= speedFactor * 0.6; // Traffic moves slower than max player speed

                    // Respawn car behind horizon if passed
                    if (car.position.z < -10) {
                        car.position.z = 150 + Math.random() * 30;
                        car.position.x = laneXPositions[Math.floor(Math.random() * laneXPositions.length)];
                    }
                });

                // 4. Update Stats & UI
                state.distance += speedFactor;
                state.score += (state.speed * 0.05);

                document.getElementById('speed-val').innerText = Math.floor(state.speed);
                document.getElementById('score-val').innerText = Math.floor(state.score);

                // 5. Dynamic Camera FX (FOV & Shake based on speed)
                camera.fov = CONFIG.cameraFovBase + (state.speed / CONFIG.maxSpeed) * 15;
                camera.updateProjectionMatrix();

                camera.position.x = playerCar.position.x * 0.3; // Slight camera lag behind car turn
                camera.position.y = 3 + (Math.random() * (state.speed / CONFIG.maxSpeed) * 0.03); // Speed Shake

                // 6. Check Collisions
                checkCollisions();
            }

            renderer.render(scene, camera);
        }

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start Game Loop
        animate();
    </script>
</body>
</html>
